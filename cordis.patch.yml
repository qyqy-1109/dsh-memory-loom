# yu（余）的配置层：向 profile 插入一行插件条目。
# 后层按 id 覆盖前层，且 config 是整段替换（不是深合并）。
#
# 注意：`name` 必须和 package.json 的 `name` 一模一样 —— 加载器就是按这个名字
# 去 profile 的 node_modules 里找模块的。改名只改 package.json 的话，
# 这一行会指向一个不存在的包，插件整块装不上（服务端和客户端一起消失）。
#
# 0.56.1 回退：作用域名在**临时 web profile** 里验得过，但在**桌面（Electron 托管）profile**
# 里失败 —— 启动时插件被踢出 bundles，用户被锁在外面。
# 定论：桌面 profile 的加载路径和 web profile 不是同一条，前者命令行连 --dump-config 都不许。
# 所以名字可以叫 yu，包名继续用 dsh-memory-loom；要换包名必须走应用内的插件管理，不走命令行。
- insert:
    - id: memory-loom
      name: "dsh-memory-loom"
      config: {}
