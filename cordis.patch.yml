# yu（余）的配置层：向 profile 插入一行插件条目。
# 后层按 id 覆盖前层，且 config 是整段替换（不是深合并）。
#
# 注意：`name` 必须和 package.json 的 `name` 一模一样 —— 加载器就是按这个名字
# 去 profile 的 node_modules 里找模块的。改名只改 package.json 的话，
# 这一行会指向一个不存在的包，插件整块装不上（服务端和客户端一起消失）。
#
# 0.56.0 正式改名：这里跟 package.json 一起换成作用域包名。
# 这一步先在临时 profile 里验过了（插件的 API 应答、启动清单里有客户端 bundle 且带 rev、日志无 skip），
# 才敢动生产环境。
- insert:
    - id: memory-loom
      name: "@qyqy-1109/yu"
      config: {}
